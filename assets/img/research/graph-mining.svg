<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Graph network illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#e6f0fc"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#12326b" opacity=".07"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2f7de1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f7de1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hullA">
      <stop offset="0" stop-color="#12326b" stop-opacity=".08"/>
      <stop offset="1" stop-color="#12326b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hullB">
      <stop offset="0" stop-color="#2f7de1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#2f7de1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>
  <rect width="480" height="360" rx="20" fill="url(#dots)"/>

  <!-- communities -->
  <circle cx="140" cy="195" r="110" fill="url(#hullA)"/>
  <circle cx="345" cy="185" r="115" fill="url(#hullB)"/>

  <!-- edges -->
  <g stroke="#12326b" stroke-width="1.6" stroke-linecap="round" opacity=".45">
    <line x1="120" y1="125" x2="85" y2="190"/>
    <line x1="120" y1="125" x2="175" y2="140"/>
    <line x1="120" y1="125" x2="150" y2="200"/>
    <line x1="85" y1="190" x2="150" y2="200"/>
    <line x1="85" y1="190" x2="110" y2="255"/>
    <line x1="150" y1="200" x2="110" y2="255"/>
    <line x1="150" y1="200" x2="190" y2="245"/>
    <line x1="175" y1="140" x2="150" y2="200"/>
    <line x1="110" y1="255" x2="190" y2="245"/>
    <line x1="175" y1="140" x2="240" y2="180"/>
    <line x1="150" y1="200" x2="240" y2="180"/>
  </g>
  <g stroke="#2f7de1" stroke-width="1.6" stroke-linecap="round" opacity=".55">
    <line x1="240" y1="180" x2="305" y2="120"/>
    <line x1="240" y1="180" x2="300" y2="205"/>
    <line x1="305" y1="120" x2="360" y2="160"/>
    <line x1="305" y1="120" x2="395" y2="105"/>
    <line x1="395" y1="105" x2="360" y2="160"/>
    <line x1="360" y1="160" x2="300" y2="205"/>
    <line x1="360" y1="160" x2="375" y2="235"/>
    <line x1="300" y1="205" x2="375" y2="235"/>
    <line x1="300" y1="205" x2="330" y2="275"/>
    <line x1="375" y1="235" x2="330" y2="275"/>
    <line x1="375" y1="235" x2="415" y2="285"/>
  </g>
  <!-- predicted link -->
  <line x1="190" y1="245" x2="300" y2="205" stroke="#2f7de1" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>

  <!-- nodes -->
  <g fill="#fff" stroke="#12326b" stroke-width="2.4">
    <circle cx="120" cy="125" r="11"/>
    <circle cx="85" cy="190" r="8"/>
    <circle cx="150" cy="200" r="13" fill="#12326b"/>
    <circle cx="110" cy="255" r="9"/>
    <circle cx="175" cy="140" r="7"/>
    <circle cx="190" cy="245" r="9"/>
  </g>
  <circle cx="240" cy="180" r="36" fill="url(#glow)"/>
  <circle cx="240" cy="180" r="12" fill="#1f4fa3" stroke="#fff" stroke-width="3"/>
  <g fill="#fff" stroke="#2f7de1" stroke-width="2.4">
    <circle cx="305" cy="120" r="10"/>
    <circle cx="360" cy="160" r="13" fill="#2f7de1"/>
    <circle cx="395" cy="105" r="7"/>
    <circle cx="300" cy="205" r="9"/>
    <circle cx="375" cy="235" r="10"/>
    <circle cx="330" cy="275" r="8"/>
    <circle cx="415" cy="285" r="6"/>
  </g>

  <!-- node feature vector -->
  <g transform="translate(40 302)">
    <rect width="92" height="30" rx="8" fill="#fff" stroke="#e3e8f0"/>
    <rect x="10" y="12" width="10" height="10" rx="2" fill="#12326b" opacity=".85"/>
    <rect x="24" y="8" width="10" height="14" rx="2" fill="#12326b" opacity=".55"/>
    <rect x="38" y="14" width="10" height="8" rx="2" fill="#12326b" opacity=".35"/>
    <rect x="52" y="6" width="10" height="16" rx="2" fill="#2f7de1" opacity=".8"/>
    <rect x="66" y="11" width="10" height="11" rx="2" fill="#2f7de1" opacity=".5"/>
  </g>
  <!-- prediction label -->
  <g transform="translate(330 40)">
    <rect width="104" height="30" rx="15" fill="#fff" stroke="#e3e8f0"/>
    <circle cx="18" cy="15" r="5" fill="#2f7de1"/>
    <rect x="30" y="12" width="60" height="6" rx="3" fill="#2f7de1" opacity=".35"/>
  </g>
</svg>
