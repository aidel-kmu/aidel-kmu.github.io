<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Multi-agent collaboration: planner, executor and verifier agents iterating over a shared memory">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fb"/><stop offset="1" stop-color="#e6f0fc"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#2f7de1" stop-opacity=".28"/><stop offset="1" stop-color="#2f7de1" stop-opacity="0"/></radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#2f7de1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#12326b" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="480" height="360" rx="20" fill="url(#bg)"/>

  <!-- shared memory (center) -->
  <circle cx="240" cy="190" r="70" fill="url(#glow)"/>
  <g stroke="#12326b" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="3 4">
    <path d="M240 122V166"/>
    <path d="M182 223L210 207"/>
    <path d="M298 223L270 207"/>
  </g>
  <g transform="translate(206 166)">
    <rect x="4" y="-6" width="60" height="44" rx="9" fill="#fff" stroke="#e3e8f0"/>
    <rect width="68" height="48" rx="10" fill="#fff" stroke="#dbe3ef"/>
    <rect x="10" y="10" width="26" height="5" rx="2.5" fill="#12326b" fill-opacity=".5"/>
    <rect x="10" y="20" width="40" height="5" rx="2.5" fill="#12326b" fill-opacity=".25"/>
    <rect x="10" y="30" width="32" height="5" rx="2.5" fill="#2f7de1" fill-opacity=".55"/>
    <circle cx="56" cy="12.5" r="3.5" fill="#2f7de1"/>
  </g>

  <!-- collaboration loop (clockwise) -->
  <g fill="none" stroke="#2f7de1" stroke-width="2.4" stroke-linecap="round">
    <path d="M280.7 98.6A100 100 0 0 1 339.5 200.5" marker-end="url(#arr)"/>
    <path d="M298.8 270.9A100 100 0 0 1 181.2 270.9" marker-end="url(#arr)"/>
    <path d="M140.5 200.5A100 100 0 0 1 202.7 97.2" marker-end="url(#arr)"/>
  </g>

  <!-- message bubbles on the loop -->
  <g transform="translate(330 124)">
    <rect width="32" height="17" rx="8.5" fill="#fff" stroke="#e3e8f0"/>
    <circle cx="10" cy="8.5" r="2" fill="#2f7de1"/><circle cx="16" cy="8.5" r="2" fill="#2f7de1" fill-opacity=".6"/><circle cx="22" cy="8.5" r="2" fill="#2f7de1" fill-opacity=".3"/>
  </g>
  <g transform="translate(224 298)">
    <rect width="32" height="17" rx="8.5" fill="#fff" stroke="#e3e8f0"/>
    <circle cx="10" cy="8.5" r="2" fill="#12326b" fill-opacity=".6"/><circle cx="16" cy="8.5" r="2" fill="#12326b" fill-opacity=".4"/><circle cx="22" cy="8.5" r="2" fill="#12326b" fill-opacity=".25"/>
  </g>
  <g transform="translate(118 124)">
    <rect width="32" height="17" rx="8.5" fill="#fff" stroke="#e3e8f0"/>
    <circle cx="10" cy="8.5" r="2" fill="#2f7de1"/><circle cx="16" cy="8.5" r="2" fill="#2f7de1" fill-opacity=".6"/><circle cx="22" cy="8.5" r="2" fill="#2f7de1" fill-opacity=".3"/>
  </g>

  <!-- agent: planner (top) -->
  <g transform="translate(240 90)">
    <circle r="31" fill="#fff" stroke="#dbe3ef" stroke-width="1.5"/>
    <circle r="22" fill="#12326b"/>
    <g fill="#fff"><circle cx="-8" cy="-7" r="2"/><circle cx="-8" cy="0" r="2"/><circle cx="-8" cy="7" r="2"/></g>
    <g stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M-2 -7h11"/><path d="M-2 0h8"/><path d="M-2 7h10" stroke-opacity=".55"/></g>
  </g>

  <!-- agent: executor / tool user (bottom-left) -->
  <g transform="translate(153.4 240)">
    <circle r="31" fill="#fff" stroke="#dbe3ef" stroke-width="1.5"/>
    <circle r="22" fill="#2f7de1"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-6 -7l-7 7 7 7"/><path d="M6 -7l7 7-7 7"/><path d="M2 -9l-4 18" stroke-opacity=".7"/>
    </g>
  </g>

  <!-- agent: verifier (bottom-right) -->
  <g transform="translate(326.6 240)">
    <circle r="31" fill="#fff" stroke="#dbe3ef" stroke-width="1.5"/>
    <circle r="22" fill="#1f4fa3"/>
    <path d="M0 -12l10 4v6c0 7-4.5 11-10 13-5.5-2-10-6-10-13v-6z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M-4.5 0l3.2 3.2 6-6.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tools attached to executor -->
  <g stroke="#12326b" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="3 4" fill="none">
    <path d="M124 252L86 268"/>
    <path d="M132 262L112 300"/>
  </g>
  <g transform="translate(46 252)">
    <rect width="40" height="34" rx="9" fill="#fff" stroke="#e3e8f0"/>
    <ellipse cx="20" cy="11" rx="9" ry="3.5" fill="none" stroke="#12326b" stroke-opacity=".55" stroke-width="1.8"/>
    <path d="M11 11v12c0 2 4 3.5 9 3.5s9-1.5 9-3.5V11M11 17c0 2 4 3.5 9 3.5s9-1.5 9-3.5" fill="none" stroke="#12326b" stroke-opacity=".55" stroke-width="1.8"/>
  </g>
  <g transform="translate(88 298)">
    <rect width="40" height="34" rx="9" fill="#fff" stroke="#e3e8f0"/>
    <circle cx="18" cy="15" r="6.5" fill="none" stroke="#2f7de1" stroke-width="2"/>
    <path d="M23 20l6 6" stroke="#2f7de1" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- task input (top-left) -->
  <g transform="translate(26 58)">
    <rect width="84" height="64" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="12" y="13" width="34" height="6" rx="3" fill="#12326b" fill-opacity=".55"/>
    <rect x="12" y="26" width="58" height="5" rx="2.5" fill="#12326b" fill-opacity=".22"/>
    <rect x="12" y="36" width="50" height="5" rx="2.5" fill="#12326b" fill-opacity=".22"/>
    <rect x="12" y="46" width="38" height="5" rx="2.5" fill="#12326b" fill-opacity=".22"/>
    <path d="M66 10l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#2f7de1"/>
  </g>
  <path d="M114 76H205" fill="none" stroke="#12326b" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrN)"/>

  <!-- result output (right) -->
  <path d="M361 240H384" fill="none" stroke="#12326b" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrN)"/>
  <g transform="translate(390 204)">
    <rect width="70" height="72" rx="12" fill="#fff" stroke="#e3e8f0"/>
    <rect x="12" y="40" width="8" height="18" rx="2" fill="#12326b" fill-opacity=".3"/>
    <rect x="24" y="30" width="8" height="28" rx="2" fill="#12326b" fill-opacity=".5"/>
    <rect x="36" y="22" width="8" height="36" rx="2" fill="#2f7de1"/>
    <rect x="48" y="34" width="8" height="24" rx="2" fill="#12326b" fill-opacity=".3"/>
    <circle cx="58" cy="12" r="9" fill="#2f7de1"/>
    <path d="M54 12l3 3 5.5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
