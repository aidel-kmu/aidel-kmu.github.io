<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="AIDEL (Artificial Intelligence and Data Engineering Lab), Department of Computer Engineering, Keimyung University. Graph data mining, QCT-AI-based local lung abnormality analysis, recommender systems, and multi-agent systems.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AIDEL">
  <meta property="og:locale" content="ko_KR">

  <meta property="og:url" content="https://aidel-kmu.github.io/">

  <meta property="og:image:height" content="630">

  <link rel="icon" href="assets/img/logo/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/home.css">
</head>
<body data-page="home">
  <header id="site-header"></header>

  <main id="main">
    <!-- Hero -->
    <section class="hero" aria-labelledby="hero-title">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-fade" aria-hidden="true"></div>
      <div class="container hero-inner">
        <p class="hero-eyebrow"><span data-ko="계명대학교 · 컴퓨터공학과" data-en="Keimyung University · Computer Engineering"></span></p>
        <h1 id="hero-title" class="hero-title">AIDEL</h1>
        <p class="hero-name" data-site="name"></p>
        <p class="hero-tagline"
           data-ko="그래프, 의료 영상, 사용자 행동처럼 복잡하게 연결된 데이터에서 의미를 찾아내는 인공지능을 연구합니다."
           data-en="We build AI that discovers meaning in complex, connected data — from graphs and medical images to human behavior."></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#research"><span data-ko="연구 분야 살펴보기" data-en="Explore our research"></span> <span aria-hidden="true">→</span></a>
          <a class="btn btn-ghost" href="professor.html"><span data-ko="구성원 소개" data-en="Meet the team"></span></a>
        </div>
      </div>
      <a class="hero-scroll" href="#news" aria-label="Scroll down" data-aria-ko="아래로 스크롤" data-aria-en="Scroll down"><span></span></a>
    </section>

    <!-- Latest news -->
    <section class="section home-news" id="news" aria-labelledby="news-title">
      <div class="container news-grid reveal">
        <div class="news-head">
          <p class="section-eyebrow">News</p>
          <h2 id="news-title" class="section-title" data-ko="최신 소식" data-en="Latest news"></h2>
          <a class="more-link" href="news.html"><span data-ko="전체 소식 보기" data-en="All news"></span> <span aria-hidden="true">→</span></a>
        </div>
        <ol class="news-list" id="home-news-list"></ol>
      </div>
    </section>

    <!-- Research -->
    <section class="section home-research" id="research" aria-labelledby="research-title">
      <div class="container">
        <div class="research-head reveal">
          <div>
            <p class="section-eyebrow">What we explore</p>
            <h2 id="research-title" class="section-title" data-ko="연결된 데이터, 더 나은 판단" data-en="Connected data, better decisions"></h2>
            <p class="section-desc" data-ko="AIDEL은 데이터의 구조와 관계를 이해하는 인공지능을 통해 실제 문제를 해결하는 연구를 수행합니다."
               data-en="We develop AI that understands the structure and relationships within data, and apply it to real-world problems."></p>
          </div>
          <a class="more-link" href="publications.html"><span data-ko="논문 보기" data-en="Browse our publications"></span> <span aria-hidden="true">→</span></a>
        </div>

        <div class="carousel reveal" id="research-carousel" role="region" aria-roledescription="carousel" aria-labelledby="research-title" tabindex="-1">
          <div class="carousel-viewport">
            <div class="carousel-track" id="research-track"></div>
          </div>
          <div class="carousel-controls">
            <div class="carousel-dots" id="research-dots"></div>
            <span class="carousel-pos" id="research-pos" aria-hidden="true"></span>
            <div class="carousel-buttons">
              <button type="button" class="cbtn" id="research-prev" aria-label="Previous" data-aria-ko="이전" data-aria-en="Previous">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
              </button>
              <button type="button" class="cbtn" id="research-pause" aria-pressed="false" aria-label="Pause">
                <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
                <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>
              </button>
              <button type="button" class="cbtn" id="research-next" aria-label="Next" data-aria-ko="다음" data-aria-en="Next">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Key figures -->
    <section class="section home-stats-section" aria-labelledby="stats-title">
      <div class="container reveal">
        <p class="section-eyebrow">Key figures</p>
        <h2 id="stats-title" class="section-title" data-ko="AIDEL at a Glance" data-en="AIDEL at a Glance"></h2>
        <div class="stats" id="home-stats"></div>
      </div>
    </section>

    <!-- Join: 학생 모집 시 아래 section 의 hidden 속성을 지우면 다시 보입니다. -->
    <section class="section home-join" id="join" aria-labelledby="join-title" hidden>
      <div class="container">
        <div class="join-card reveal">
          <div class="join-text">
            <p class="section-eyebrow">Join the lab</p>
            <h2 id="join-title" class="section-title" data-ko="함께 연구할 학생을 찾습니다" data-en="We are looking for motivated students"></h2>
            <p data-ko="AIDEL은 그래프 데이터, 의료 인공지능, 추천 시스템, 멀티 에이전트 시스템 연구에 관심 있는 학부연구생과 대학원생(석사·박사)을 언제나 환영합니다. 프로그래밍 경험이나 배경지식보다 배우고자 하는 열정과 끈기를 더 중요하게 생각합니다."
               data-en="AIDEL welcomes undergraduate research interns and graduate students (M.S. and Ph.D.) who are interested in graph data, medical AI, recommender systems, and multi-agent systems. Curiosity and persistence matter more to us than prior experience."></p>
            <p class="join-note" data-ko="지원을 희망하는 학생은 사전에 이메일로 교수님께 연락해 주세요. 간단한 자기소개와 관심 연구 분야를 함께 보내 주시면 좋습니다."
               data-en="If you are interested, please contact the professor by email in advance, with a brief introduction and your research interests."></p>
          </div>
          <div class="join-action">
            <a class="btn btn-primary" id="join-mail" href="#">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <span data-ko="이메일로 문의하기" data-en="Contact by email"></span>
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/i18n.js"></script>

</body>
</html>
